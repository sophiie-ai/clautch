name: Clautch

options:
  bundleIdPrefix: com.clautch
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Clautch:
    type: application
    platform: macOS
    sources:
      - path: Clautch
        excludes:
          - Resources/**
    resources:
      - path: Clautch/Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clautch.app
        MARKETING_VERSION: "0.2.4" # x-release-please-version
        CURRENT_PROJECT_VERSION: "6"
        INFOPLIST_FILE: Clautch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Clautch/Clautch.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U2KP726DRL
